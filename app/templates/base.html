<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}售后报修智能分诊平台{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="site-title" href="{{ url_for('tickets.list_tickets') }}">售后报修智能分诊平台</a>
            <nav class="site-nav">
                <a href="{{ url_for('tickets.new_ticket') }}">提交报修</a>
                <a href="{{ url_for('tickets.list_tickets') }}">工单列表</a>
            </nav>
        </div>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for msg in messages %}<div class="alert alert-success">{{ msg }}</div>{% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
